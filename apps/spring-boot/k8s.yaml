apiVersion: v1
kind: Service
metadata:
  name: spring-boot-app
  namespace: elastic-stack
  labels:
    app: spring-boot-app
    app.kubernetes.io/part-of: elastic-apm-demo
spec:
  selector:
    app: spring-boot-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-app
  namespace: elastic-stack
  labels:
    app: spring-boot-app
    app.kubernetes.io/part-of: elastic-apm-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-boot-app
  template:
    metadata:
      labels:
        app: spring-boot-app
        app.kubernetes.io/part-of: elastic-apm-demo
    spec:
      containers:
        - name: app
          image: elastic-apm-demo/spring-boot-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ELASTIC_APM_SERVER_URL
              value: "http://apm-server:8200"
            - name: ELASTIC_APM_SERVICE_NAME
              value: "spring-boot-app"
            - name: ELASTIC_APM_ENVIRONMENT
              value: "development"
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
