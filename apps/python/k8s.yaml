apiVersion: v1
kind: Service
metadata:
  name: python-app
  namespace: elastic-stack
  labels:
    app: python-app
    app.kubernetes.io/part-of: elastic-apm-demo
spec:
  selector:
    app: python-app
  ports:
  - name: http
    port: 5000
    targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
  namespace: elastic-stack
  labels:
    app: python-app
    app.kubernetes.io/part-of: elastic-apm-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
        app.kubernetes.io/part-of: elastic-apm-demo
      annotations:
        co.elastic.logs/enabled: "true"
        instrumentation.opentelemetry.io/inject-python: elastic-stack/otel-instrumentation
    spec:
      containers:
      - name: app
        image: localhost:32000/python-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
        env:
        - name: ELASTIC_APM_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: apm-config
              key: ELASTIC_APM_SERVER_URL
        - name: ELASTIC_APM_SERVICE_NAME
          value: python-app
        - name: ELASTIC_APM_ENVIRONMENT
          value: development
        - name: ELASTIC_APM_API_KEY
          valueFrom:
            secretKeyRef:
              name: elastic-apm
              key: token
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
