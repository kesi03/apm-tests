apiVersion: v1
kind: Service
metadata:
  name: react-app
  namespace: elastic-stack
  labels:
    app: react-app
    app.kubernetes.io/part-of: elastic-apm-demo
spec:
  selector:
    app: react-app
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-app
  namespace: elastic-stack
  labels:
    app: react-app
    app.kubernetes.io/part-of: elastic-apm-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
        app.kubernetes.io/part-of: elastic-apm-demo
      annotations:
        co.elastic.logs/enabled: "true"
        co.elastic.logs/module: "nginx"
        co.elastic.logs/fileset.stdout: "access"
        co.elastic.logs/fileset.stderr: "error"
    spec:
      containers:
        - name: app
          image: elastic-apm-demo/react-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
