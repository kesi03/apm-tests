apiVersion: v1
kind: Service
metadata:
  name: golang-app
  namespace: elastic-stack
  labels:
    app: golang-app
    app.kubernetes.io/part-of: elastic-apm-demo
spec:
  selector:
    app: golang-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golang-app
  namespace: elastic-stack
  labels:
    app: golang-app
    app.kubernetes.io/part-of: elastic-apm-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: golang-app
  template:
    metadata:
      labels:
        app: golang-app
        app.kubernetes.io/part-of: elastic-apm-demo
    spec:
      containers:
        - name: app
          image: elastic-apm-demo/golang-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ELASTIC_APM_SERVER_URL
              value: "http://apm-server:8200"
            - name: ELASTIC_APM_SERVICE_NAME
              value: "golang-app"
            - name: ELASTIC_APM_ENVIRONMENT
              value: "development"
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
