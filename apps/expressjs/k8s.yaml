apiVersion: v1
kind: Service
metadata:
  name: expressjs-app
  namespace: elastic-stack
  labels:
    app: expressjs-app
    app.kubernetes.io/part-of: elastic-apm-demo
spec:
  selector:
    app: expressjs-app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expressjs-app
  namespace: elastic-stack
  labels:
    app: expressjs-app
    app.kubernetes.io/part-of: elastic-apm-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expressjs-app
  template:
    metadata:
      labels:
        app: expressjs-app
        app.kubernetes.io/part-of: elastic-apm-demo
    spec:
      containers:
        - name: app
          image: elastic-apm-demo/expressjs-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: ELASTIC_APM_SERVER_URL
              value: "http://apm-server:8200"
            - name: ELASTIC_APM_SERVICE_NAME
              value: "expressjs-app"
            - name: ELASTIC_APM_ENVIRONMENT
              value: "development"
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
