apiVersion: v1
kind: ServiceAccount
metadata:
  name: elastic-agent
  namespace: elastic-stack
  labels:
    app: elastic-agent
    app.kubernetes.io/part-of: elastic-apm-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elastic-agent
  labels:
    app.kubernetes.io/part-of: elastic-apm-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: elastic-agent
  labels:
    app.kubernetes.io/part-of: elastic-apm-demo
subjects:
  - kind: ServiceAccount
    name: elastic-agent
    namespace: elastic-stack
roleRef:
  kind: ClusterRole
  name: elastic-agent
  apiGroup: rbac.authorization.k8s.io
