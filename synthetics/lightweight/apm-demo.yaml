# Lightweight HTTP monitors for the demo apps (migrated from heartbeat/).
#
# These mirror the Heartbeat monitors. They run on the "apm-demo-private"
# Private Location (an Elastic Agent deployed in the cluster), so they can
# reach the in-cluster service DNS names (java-app:8080, etc.).
#
# Note: Synthetics project (lightweight) monitors allow exactly ONE url per
# monitor (9.6.0+), so each app has a separate monitor per endpoint.
#
# Push with: npx @elastic/synthetics push --auth $SYNTHETICS_API_KEY
heartbeat.monitors:
  - type: http
    id: java-http
    name: java-app /
    service.name: java-app
    schedule: '@every 60m'
    timeout: 10s
    urls: ["http://java-app:8080/"]
    check.response.status: [200]
    private_locations: ["apm-demo-private"]

  - type: http
    id: java-slow
    name: java-app /slow
    service.name: java-app
    schedule: '@every 60m'
    timeout: 10s
    urls: ["http://java-app:8080/slow"]
    check.response.status: [200]
    private_locations: ["apm-demo-private"]

  - type: http
    id: java-error
