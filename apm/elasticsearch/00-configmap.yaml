apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
  namespace: elastic-stack
  labels:
    app: elasticsearch
    app.kubernetes.io/part-of: elastic-stack
data:
  elasticsearch.yml: |
    cluster.name: apm-cluster
    node.name: ${NODE_NAME}

    network.host: 0.0.0.0

    discovery.seed_hosts:
      - elasticsearch-0.elasticsearch-headless.elastic-stack.svc.cluster.local
    cluster.initial_master_nodes:
      - elasticsearch-0

    # Development-only configuration. Enable xpack security + TLS for production.
    xpack.security.enabled: false
    xpack.security.transport.ssl.enabled: false

    # Built-in APM integration: installs APM index templates and ingest
    # pipelines inside Elasticsearch (default on since 8.15).
    xpack.apm_data.enabled: true
