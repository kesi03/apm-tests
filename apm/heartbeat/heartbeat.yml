    service.name: expressjs-app
    schedule: '@every 45m'
    urls: ["http://expressjs-app:3000/", "http://expressjs-app:3000/slow"]
    check.response.status: [200]
    check.timeout: 10s

  - type: http
    id: expressjs-error
    name: expressjs-app /error
    service.name: expressjs-app
