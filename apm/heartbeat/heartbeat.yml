# Elastic Heartbeat monitors for the demo apps.
#
# Each server-side app is checked on its three demo routes:
#   - /        -> 200 (app up)
#   - /slow    -> 200 (slow endpoint works)
#   - /error   -> 500 (error route raises an exception as expected)
#
# Uptime results are written to Elasticsearch (heartbeat-* indices) and
# shown in Kibana under Observability -> Uptime. The `service.name` on each
# monitor matches the app's APM service name, so the Uptime monitor links to
# the corresponding APM service in Kibana.

# Run all monitors exactly once, then exit. This lets the Heartbeat daemon run
# as a Kubernetes CronJob (one full check pass every 45 minutes) instead of a
# long-running Deployment. The monitor schedules below are still required and
# are used for the `monitor.timespan` field.
heartbeat.run_once: true

heartbeat.monitors:
  - type: http
    id: java-http
    name: java-app (/, /slow)
    service.name: java-app
    schedule: '@every 45m'
    urls: ["http://java-app:8080/", "http://java-app:8080/slow"]
    check.response.status: [200]
    check.timeout: 10s

  - type: http
    id: java-error
    name: java-app /error
    service.name: java-app
    schedule: '@every 45m'
    urls: ["http://java-app:8080/error"]
    check.response.status: [500]
    check.timeout: 10s

  - type: http
    id: spring-boot-http
    name: spring-boot-app (/, /slow)
    service.name: spring-boot-app
    schedule: '@every 45m'
    urls: ["http://spring-boot-app:8080/", "http://spring-boot-app:8080/slow"]
    check.response.status: [200]
    check.timeout: 10s

  - type: http
