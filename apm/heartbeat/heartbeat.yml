    urls: ["http://azure-devops-agent:8080/healthz"]
    check.response.status: [200]
    check.timeout: 10s

# Heartbeat ships uptime data to Elastic Cloud (managed Elasticsearch).
# NOTE: libbeat expects the RAW "id:api_key" form here and base64-encodes it
# itself when sending the Authorization header. Passing the already-base64
# encoded string yields "401 invalid ApiKey value" from Elasticsearch.
