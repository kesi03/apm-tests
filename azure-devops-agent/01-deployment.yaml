apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-devops-agent
  namespace: elastic-stack
  labels:
    app: azure-devops-agent
    app.kubernetes.io/part-of: elastic-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azure-devops-agent
  template:
    metadata:
      labels:
        app: azure-devops-agent
        app.kubernetes.io/part-of: elastic-stack
      annotations:
        co.elastic.logs/enabled: "true"
        instrumentation.opentelemetry.io/inject-nodejs: elastic-stack/otel-instrumentation
    spec:
      containers:
        - name: azure-devops-agent
          image: elastic-apm-demo/azure-devops-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AZURE_DEVOPS_EXTENSION_PAT
              valueFrom:
                secretKeyRef:
                  name: azure-devops-agent
                  key: AZURE_DEVOPS_EXTENSION_PAT
            - name: AZURE_DEVOPS_URL
              value: https://dev.azure.com/mockholm
            - name: AZURE_DEVOPS_POOL
              value: mockholmian
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
        - name: health
          image: python:3-alpine
          command:
            - /bin/sh
            - -c
            - |
              python - <<'PY'
              from http.server import BaseHTTPRequestHandler, HTTPServer
              import subprocess
              class Health(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/healthz":
                          up = subprocess.run(["pgrep", "-f", "Agent.Listener"], capture_output=True).returncode == 0
                          self.send_response(200 if up else 503)
                          self.end_headers()
                          self.wfile.write(b"ok" if up else b"agent down")
                      else:
                          self.send_response(404)
                          self.end_headers()
                  def log_message(self, *args):
                      pass
              HTTPServer(("0.0.0.0", 8080), Health).serve_forever()
              PY
          ports:
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
