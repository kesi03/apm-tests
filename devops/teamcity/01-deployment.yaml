apiVersion: apps/v1
kind: Deployment
metadata:
  name: teamcity-server
  namespace: elastic-stack
  labels:
    app: teamcity-server
    app.kubernetes.io/part-of: elastic-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teamcity-server
  template:
    metadata:
      labels:
        app: teamcity-server
        app.kubernetes.io/part-of: elastic-stack
      annotations:
        co.elastic.logs/enabled: "true"
    spec:
      containers:
        - name: teamcity-server
          image: jetbrains/teamcity-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8111
          env:
            - name: TEAMCITY_SERVER_OPTS
              value: "-Dteamcity.server.rootURL=http://teamcity-server:8111"
            - name: TEAMCITY_DATA_PATH
              value: /data/teamcity_server/datadir
            - name: TEAMCITY_SERVER_MEM_OPTS
              value: "-Xmx1g -XX:ReservedCodeCacheSize=350m"
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data/teamcity_server/datadir
          startupProbe:
            httpGet:
              path: /login.html
              port: http
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /login.html
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /login.html
              port: http
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: teamcity-data
