apiVersion: v1
kind: Secret
metadata:
  name: azure-devops-agent
  namespace: elastic-stack
  labels:
    app: azure-devops-agent
    app.kubernetes.io/part-of: elastic-stack
type: Opaque
stringData:
  # Replace this with the real Azure DevOps PAT before applying to the cluster.
  # For GitOps, prefer injecting this value via an external secret manager or CI secret.
  AZURE_DEVOPS_EXTENSION_PAT: "REPLACE_WITH_AZURE_DEVOPS_PAT"
