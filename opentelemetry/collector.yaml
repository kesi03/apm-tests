apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: elastic-stack
  labels:
    app: otel-collector
    app.kubernetes.io/part-of: elastic-stack
data:
  config.yaml: |
    # OpenTelemetry Collector: receives OTLP traces from auto-instrumented
    # workloads and forwards them to Elastic Cloud's managed APM Server,
    # which accepts OTLP natively on port 443. Auth is the APM API key.
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch: {}

    exporters:
      otlp_grpc/apm:
        endpoint: my-observability-project-d54a32.apm.europe-west2.gcp.elastic.cloud:443
        headers:
          Authorization: ApiKey QkR1dzRwOEI0a2lFamVIMU9LeGI6b1RsV3BuT1NNcEYwWGpYY0dvWGgzUQ==

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp_grpc/apm]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: elastic-stack
  labels:
    app: otel-collector
    app.kubernetes.io/part-of: elastic-stack
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: health
      port: 13133
      targetPort: 13133
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: elastic-stack
  labels:
    app: otel-collector
    app.kubernetes.io/part-of: elastic-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        app.kubernetes.io/part-of: elastic-stack
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.158.0
          args:
            - "--config=/etc/otelcol/config.yaml"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
