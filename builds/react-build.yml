apiVersion: batch/v1
kind: Job
metadata:
  name: build-react
  namespace: builds
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:latest
        args:
        - "--dockerfile=apps/react/Dockerfile"
        - "--context=git://github.com/kesi03/apm-tests.git#main"
        - "--destination=registry:32000/react-app:latest"
        - "--insecure-registry=registry:32000"
        - "--skip-tls-verify-registry=registry:32000"
      restartPolicy: Never
