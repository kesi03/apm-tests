apiVersion: batch/v1
kind: Job
metadata:
  name: apm-tests
  namespace: elastic-stack
  labels:
    app: apm-tests
    app.kubernetes.io/part-of: elastic-apm-demo
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: apm-tests
        app.kubernetes.io/part-of: elastic-apm-demo
      annotations:
        co.elastic.logs/enabled: "true"
    spec:
      restartPolicy: Never
      containers:
        - name: tests
          image: elastic-apm-demo/tests:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ELASTICSEARCH_URL
              value: "https://my-observability-project-d54a32.es.europe-west2.gcp.elastic.cloud:443"
            - name: ELASTICSEARCH_API_KEY
              value: "VlQwczY1OEI0a2lFamVIMVhVbHM6b2h0QWppbEtIbjBzSWJsRFVxMTRVZw=="
            - name: KIBANA_URL
              value: "https://my-observability-project-d54a32.kb.europe-west2.gcp.elastic.cloud:443"
            - name: APM_SERVER_URL
              value: "https://my-observability-project-d54a32.apm.europe-west2.gcp.elastic.cloud:443"
            - name: APM_API_KEY
              value: "QkR1dzRwOEI0a2lFamVIMU9LeGI6b1RsV3BuT1NNcEYwWGpYY0dvWGgzUQ=="
            - name: JAVA_APP_URL
              value: "http://java-app:8080"
            - name: SPRING_BOOT_APP_URL
              value: "http://spring-boot-app:8080"
            - name: OPENLIBERTY_APP_URL
              value: "http://openliberty-app:9080"
            - name: EXPRESSJS_APP_URL
              value: "http://expressjs-app:3000"
            - name: REACT_APP_URL
              value: "http://react-app"
            - name: PYTHON_APP_URL
              value: "http://python-app:5000"
            - name: CSHARP_APP_URL
              value: "http://csharp-app:5000"
            - name: GOLANG_APP_URL
              value: "http://golang-app:8080"
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 2Gi
