# Taskfile: task runner for the Elastic Stack on Kubernetes.
# Requires: kubectl and task (https://taskfile.dev).
#
#   task start   deploy shared resources (namespace, secrets, agents)
#   task stop    remove the stack
#   task status  show stack pods and services
#   task logs    tail stack logs
#   task test    run the Jest + Playwright test suite as a Kubernetes Job
#   task start:heartbeat  deploy the Heartbeat uptime-monitor CronJob (every 45 min)
#   task run:heartbeat    trigger one heartbeat check pass now
#   task stop:heartbeat   remove the Heartbeat CronJob
#   task start:otel       deploy the OpenTelemetry Collector + Instrumentation CR
#   task stop:otel        remove the OpenTelemetry resources
#   task start:filebeat   deploy the Filebeat DaemonSet (docker/k8s logs -> Elasticsearch)
#   task stop:filebeat    remove the Filebeat DaemonSet
#   task push:synthetics  push the Synthetics project monitors to Elastic Cloud (SYNTHETICS_API_KEY required)
#   task start:synthetics-agent  deploy the Private-Location Elastic Agent DaemonSet
#   task stop:synthetics-agent   remove the Private-Location Elastic Agent DaemonSet
#   task build:agent AZDO_PAT=...  build the Azure DevOps agent image and store the PAT in the k8s secret
version: '3'

vars:
  NAMESPACE: elastic-stack
  TIMEOUT: '300'
  IMAGE_PREFIX: elastic-apm-demo
  KB_URL: https://my-observability-project-d54a32.kb.europe-west2.gcp.elastic.cloud:443
  SYNTHETICS_API_KEY: '{{.SYNTHETICS_API_KEY | default "$SYNTHETICS_API_KEY"}}'
  APPS:
    - java
    - spring-boot
    - openliberty
    - expressjs
    - react
    - python
    - csharp
    - golang

tasks:
  default:
    desc: Deploy the Elastic Stack and wait for readiness
    cmds:
      - task: start

  start:
    desc: Deploy shared resources (namespace, secrets, agents) and show endpoints
    cmds:
      - kubectl apply -k .
      - task: endpoints

  endpoints:
    desc: Show services and Elastic Cloud endpoints
    cmds:
      - kubectl get svc -n {{.NAMESPACE}}
      - echo
      - echo "Elastic Cloud endpoints:"
      
  stop:
    desc: Remove the Elastic Stack from the cluster
    cmds:
      - kubectl delete -k . --ignore-not-found=true

  status:
    desc: Show stack pods and services
    cmds:
      - kubectl get pods,svc -n {{.NAMESPACE}} -l app.kubernetes.io/part-of=elastic-stack

  logs:
    desc: Tail logs of all stack pods
    cmds:
      - kubectl logs -n {{.NAMESPACE}} -l app.kubernetes.io/part-of=elastic-stack -f

  start:apps:
    desc: Build and deploy all demo apps (e.g. task start:apps:java)
    cmds:
      - for: { var: APPS }
        task: start:apps:{{.ITEM}}

  start:apps:java:
    desc: Build and deploy the java demo app
    cmds:
      - task: deploy-app
        vars: { APP_NAME: java }

  start:apps:spring-boot:
    desc: Build and deploy the spring-boot demo app
    cmds:
      - task: deploy-app
        vars: { APP_NAME: spring-boot }

  start:apps:openliberty:
    desc: Build and deploy the openliberty demo app
    cmds:
      - task: deploy-app
        vars: { APP_NAME: openliberty }

  start:apps:expressjs:
    desc: Build and deploy the expressjs demo app
    cmds:
      - task: deploy-app
        vars: { APP_NAME: expressjs }

  start:apps:react:
    desc: Build and deploy the react demo app
    cmds:
      - task: deploy-app
        vars: { APP_NAME: react }

  start:apps:python:
    desc: Build and deploy the python demo app
    cmds:
      - task: deploy-app
        vars: { APP_NAME: python }

  start:apps:csharp:
    desc: Build and deploy the csharp demo app
    cmds:
      - task: deploy-app
        vars: { APP_NAME: csharp }

  start:apps:golang:
    desc: Build and deploy the golang demo app
    cmds:
      - task: deploy-app
        vars: { APP_NAME: golang }

  deploy-app:
    internal: true
    dir: apps/{{.APP_NAME}}
    cmds:
      - docker build -t {{.IMAGE_PREFIX}}/{{.APP_NAME}}-app:latest .
      - kubectl apply -f k8s.yaml

  test:
    desc: Build the test image and run the Jest + Playwright suite as a Job
    cmds:
      - docker build -t {{.IMAGE_PREFIX}}/tests:latest -f tests/Dockerfile tests/
      - kubectl delete job/apm-tests -n {{.NAMESPACE}} --ignore-not-found=true
      - kubectl apply -f tests/k8s.yaml
      - cmd: kubectl wait --for=condition=complete --timeout={{.TIMEOUT}}s job/apm-tests -n {{.NAMESPACE}}
        ignore_error: true
      - kubectl logs job/apm-tests -n {{.NAMESPACE}}
      - kubectl get job apm-tests -n {{.NAMESPACE}}
      - kubectl wait --for=jsonpath=.status.succeeded=1 --timeout=10s job/apm-tests -n {{.NAMESPACE}}

  build:agent:
    desc: Build the Azure DevOps agent image and store AZDO_PAT in the k8s secret
    vars:
      AZDO_PAT: '{{.AZDO_PAT | default "$AZDO_PAT"}}'
    cmds:
      - docker build -t {{.IMAGE_PREFIX}}/azure-devops-agent:latest azure-devops-agent/
      - cmd: |
          [ -n "{{.AZDO_PAT}}" ] || { echo "AZDO_PAT is not set (pass AZDO_PAT=... or export it)"; exit 1; }
          kubectl create secret generic azure-devops-agent \
            --namespace {{.NAMESPACE}} \
            --from-literal=AZURE_DEVOPS_EXTENSION_PAT="{{.AZDO_PAT}}" \
            --dry-run=client -o yaml | kubectl apply -f -

  send:agent-pat:
    desc: Send the Azure DevOps agent PAT to the k8s secret (AZDO_PAT required)
    vars:
      AZDO_PAT: '{{.AZDO_PAT | default "$AZDO_PAT"}}'
    cmds:
      - cmd: |
          [ -n "{{.AZDO_PAT}}" ] || { echo "AZDO_PAT is not set (pass AZDO_PAT=... or export it)"; exit 1; }
          kubectl create secret generic azure-devops-agent \
            --namespace {{.NAMESPACE}} \
            --from-literal=AZURE_DEVOPS_EXTENSION_PAT="{{.AZDO_PAT}}" \
            --dry-run=client -o yaml | kubectl apply -f -

  start:heartbeat:
    desc: Deploy the Heartbeat uptime-monitor CronJob for the demo apps (non-react, every 45 min)
    cmds:
      - kubectl delete deploy/heartbeat -n {{.NAMESPACE}} --ignore-not-found=true
      - kubectl apply -f heartbeat/k8s.yaml

  run:heartbeat:
    desc: Trigger one heartbeat check pass immediately as a Job
    cmds:
      - kubectl delete job/heartbeat-manual -n {{.NAMESPACE}} --ignore-not-found=true
      - kubectl create job --from=cronjob/heartbeat heartbeat-manual -n {{.NAMESPACE}}
      - kubectl wait --for=condition=complete --timeout=300s job/heartbeat-manual -n {{.NAMESPACE}}

  stop:heartbeat:
    desc: Remove the Heartbeat CronJob
    cmds:
      - kubectl delete -f heartbeat/k8s.yaml --ignore-not-found=true
      - kubectl delete deploy/heartbeat -n {{.NAMESPACE}} --ignore-not-found=true

  install:
    desc: Deploy the Elastic Stack and wait for readiness
    cmds:
      - task: install:cert-manager
      - task: install:otel
  
  # 1. cert-manager
  install:cert-manager:
    desc: Install cert-manager helm chart
    cmds:
      - helm repo add jetstack https://charts.jetstack.io
      - helm upgrade --install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --set crds.enabled=true

  install:otel:
    desc: Install OpenTelemetry helm charts
    cmds:
      # 2. OpenTelemetry Operator
      - helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
      - helm upgrade --install opentelemetry-operator open-telemetry/opentelemetry-operator --namespace opentelemetry-operator-system --create-namespace
      
  start:otel:
    desc: Deploy the OpenTelemetry Collector and Instrumentation CR
    cmds:
      - kubectl apply -f opentelemetry/collector.yaml
      - kubectl apply -f opentelemetry/instrumentation.yaml

  stop:otel:
    desc: Remove the OpenTelemetry resources
    cmds:
      - kubectl delete -f opentelemetry/instrumentation.yaml --ignore-not-found=true
      - kubectl delete -f opentelemetry/collector.yaml --ignore-not-found=true

  start:filebeat:
    desc: Deploy the Filebeat DaemonSet to ship docker/k8s container logs to Elasticsearch
    cmds:
      - kubectl apply -f filebeat/00-rbac.yaml
      - kubectl apply -f filebeat/01-configmap.yaml
      - kubectl apply -f filebeat/02-daemonset.yaml
      - kubectl rollout status daemonset/filebeat -n kube-system --timeout={{.TIMEOUT}}s

  stop:filebeat:
    desc: Remove the Filebeat DaemonSet
    cmds:
      - kubectl delete -f filebeat/02-daemonset.yaml --ignore-not-found=true
      - kubectl delete -f filebeat/01-configmap.yaml --ignore-not-found=true
      - kubectl delete -f filebeat/00-rbac.yaml --ignore-not-found=true

  push:synthetics:
    desc: Push the Synthetics project monitors to Elastic Cloud (requires SYNTHETICS_API_KEY)
    dir: synthetics
    cmds:
      - cmd: |
          [ -n "{{.SYNTHETICS_API_KEY}}" ] || { echo "SYNTHETICS_API_KEY is not set (export it first)"; exit 1; }
          npx --yes @elastic/synthetics@latest push --auth "{{.SYNTHETICS_API_KEY}}" --url {{.KB_URL}}

  synthetics:locations:
    desc: List Synthetics locations (managed + private) for the project
    dir: synthetics
    cmds:
      - cmd: |
          [ -n "{{.SYNTHETICS_API_KEY}}" ] || { echo "SYNTHETICS_API_KEY is not set (export it first)"; exit 1; }
          npx --yes @elastic/synthetics@latest locations --url {{.KB_URL}} --auth "{{.SYNTHETICS_API_KEY}}"

  start:synthetics-agent:
    desc: Deploy the Private-Location Elastic Agent (needs secret fleet-enrollment, see synthetics/agent/)
    cmds:
      - kubectl apply -f synthetics/agent/00-rbac.yaml
      - kubectl apply -f synthetics/agent/01-daemonset.yaml
      - kubectl rollout status daemonset/elastic-agent -n {{.NAMESPACE}} --timeout={{.TIMEOUT}}s

  stop:synthetics-agent:
    desc: Remove the Private-Location Elastic Agent
    cmds:
      - kubectl delete -f synthetics/agent/01-daemonset.yaml --ignore-not-found=true
      - kubectl delete -f synthetics/agent/00-rbac.yaml --ignore-not-found=true
